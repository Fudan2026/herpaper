name: Notify SuPro deploy

# HerPaper single-source-of-truth pipeline: every push to main tells
# Fudan2026/supro to redeploy (repository_dispatch: herpaper-updated).
# The supro cloudflare.yml build's prebuild then pulls the app from this repo.
on:
  push:
    branches: [main]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Fire repository_dispatch at Fudan2026/supro
        env:
          SUPRO_DISPATCH_TOKEN: ${{ secrets.SUPRO_DISPATCH_TOKEN }}
        run: |
          curl -f -s -X POST \
            -H "Authorization: Bearer $SUPRO_DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/Fudan2026/supro/dispatches \
            -d '{"event_type":"herpaper-updated"}'
